spring.application.name=sulwork
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sulwork}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sulwork}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sulwork}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
